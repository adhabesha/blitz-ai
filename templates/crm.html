<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM – Blitz AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css"><link rel="stylesheet" href="/static/crm.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>window.FB={apiKey:{{.APIKey}},authDomain:{{.AuthDomain}},projectId:{{.ProjectID}}};</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("bz-theme")||"dark"}catch(e){}</script>
</head><body class="bz bx">
<header class="bx-top">
 <a class="bx-brand" href="/crm"><i></i>Blitz<b>CRM</b></a>
 <div class="bx-search"><input id="gsearch" placeholder="Search leads, deals, contacts, companies…" autocomplete="off"><div id="gres" class="bx-gres" hidden></div></div>
 <span class="sp"></span>
 <div class="bx-create"><button class="bx-plus" id="plus">+ Create</button><div id="plusm" class="bx-menu" hidden></div></div>
 <span class="crm-role" id="who"></span>
 <div class="bz-theme"><button data-t="dark" title="Dark">&#9790;</button><button data-t="slate" title="Slate">&#9681;</button><button data-t="light" title="Light">&#9728;</button></div>
 <a class="bz-mini" href="/dashboard" style="text-decoration:none">&larr; Blitz AI</a>
</header>
<div class="bx-body">
 <aside class="bx-rail"><div id="nav" class="bx-navs"></div><div class="bx-rfoot"><span class="dot"></span><span class="rl">All systems live</span><button id="collapse" title="Collapse menu">&#10094;</button></div></aside>
 <main class="bx-main">
  <div class="bx-head"><div><h1 id="title">CRM</h1><p id="sub" class="bz-mut"></p></div><div id="acts" class="bx-acts"></div></div>
  <div id="tabs" class="bx-tabs"></div>
  <div id="view"><p class="bz-mut">Loading…</p></div>
  <div id="anwrap" hidden><iframe id="anframe" title="Analytics" allow="clipboard-write"></iframe></div>
 </main>
</div>
<div id="modal" class="crm-modal" hidden></div><div id="slider" class="bx-slide" hidden></div>
<script type="module" src="/static/crm.js"></script>
</body></html>
